replicaCount: 2

image:
  repository: helm-api
  tag: local
  pullPolicy: Never

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
